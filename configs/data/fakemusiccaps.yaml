# Cross-generator evaluation set. Never trained on -- it is the unseen-generator
# test that produces the headline number against the base paper's F1 0.629.
data:
  name: fakemusiccaps
  hf_dataset: LucaComanducci/FakeMusicCaps
  sample_rate: 24000
  clip_seconds: 10.0
  clips_per_song: 8
  # Match clips_per_song: segmentation returns fewer only for songs shorter
  # than one clip, and every padded clip beyond that is wasted compute.
  max_clips: 8
  eval_only: true
  n_sources: 5              # closed-set attribution, this dataset only
